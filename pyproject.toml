[project]
name = "cxr-xai"
version = "0.1.0"
description = "Класифікація рентгенограм органів грудної клітки (Xception) з фреймовою базою знань, вирішувачем на правилах і поясненнями Grad-CAM"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "imagehash>=4.3",
    "matplotlib>=3.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "pydantic-settings>=2.0",
    "scikit-learn>=1.3",
    "streamlit>=1.30",
    "tensorflow>=2.16",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Навчання на NVIDIA GPU (лише Linux/WSL2: TensorFlow >= 2.11 не підтримує GPU на «рідному» Windows).
# Встановлення: uv sync --extra gpu. На Windows/macOS цей пакет пропускається - працює CPU.
gpu = ["tensorflow[and-cuda]>=2.16; sys_platform == 'linux'"]

[project.scripts]
cxr-xai = "cxr_xai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cxr_xai"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["dataset", "outputs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "NPY", # numpy-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["cxr_xai"]
